name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dist/index.js with esbuild
        run: pnpm run build:server

      - name: Commit built dist/index.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/index.js
          git diff --staged --quiet || git commit -m "ci: build dist/index.js [skip ci]"
          git push

      - name: Trigger deploy webhook
        env:
          SHOPEE_SELLER_EMAIL: ${{ secrets.SHOPEE_SELLER_EMAIL }}
          SHOPEE_SELLER_PASSWORD: ${{ secrets.SHOPEE_SELLER_PASSWORD }}
          SHOPEE_SELLER_EMAIL_2: ${{ secrets.SHOPEE_SELLER_EMAIL_2 }}
          SHOPEE_SELLER_PASSWORD_2: ${{ secrets.SHOPEE_SELLER_PASSWORD_2 }}
          ML_EMAIL_1: ${{ secrets.ML_EMAIL_1 }}
          ML_PASSWORD_1: ${{ secrets.ML_PASSWORD_1 }}
          ML_EMAIL_2: ${{ secrets.ML_EMAIL_2 }}
          ML_PASSWORD_2: ${{ secrets.ML_PASSWORD_2 }}
        run: |
          BODY=$(jq -n \
            --arg shopee_email "$SHOPEE_SELLER_EMAIL" \
            --arg shopee_pass "$SHOPEE_SELLER_PASSWORD" \
            --arg shopee_email2 "$SHOPEE_SELLER_EMAIL_2" \
            --arg shopee_pass2 "$SHOPEE_SELLER_PASSWORD_2" \
            --arg ml_email "$ML_EMAIL_1" \
            --arg ml_pass "$ML_PASSWORD_1" \
            --arg ml_email2 "$ML_EMAIL_2" \
            --arg ml_pass2 "$ML_PASSWORD_2" \
            '{"ref":"refs/heads/main","envVars":{"SHOPEE_SELLER_EMAIL":$shopee_email,"SHOPEE_SELLER_PASSWORD":$shopee_pass,"SHOPEE_SELLER_EMAIL_2":$shopee_email2,"SHOPEE_SELLER_PASSWORD_2":$shopee_pass2,"ML_EMAIL_1":$ml_email,"ML_PASSWORD_1":$ml_pass,"ML_EMAIL_2":$ml_email2,"ML_PASSWORD_2":$ml_pass2}}')
          SIG=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "${{ secrets.DEPLOY_SECRET }}" | awk '{print $2}')
          echo "=== Enviando webhook ==="
          HTTP_CODE=$(curl -s -o /tmp/deploy_resp.txt -w "%{http_code}" -X POST https://marketing.feminnita.com.br/api/deploy \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: sha256=$SIG" \
            -H "X-GitHub-Event: push" \
            -d "$BODY")
          echo "HTTP Status: $HTTP_CODE"
          echo "Resposta: $(cat /tmp/deploy_resp.txt)"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERRO: webhook retornou $HTTP_CODE"
            exit 1
          fi
          echo "Deploy webhook disparado com sucesso"
