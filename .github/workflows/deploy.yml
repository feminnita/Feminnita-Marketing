name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 216.238.112.109
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            cd /var/www/feminnita-marketing
            git pull origin main
            npm run build
            pm2 restart feminnita-marketing
            echo "Deploy concluído"
