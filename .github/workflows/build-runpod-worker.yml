name: Build RunPod Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'runpod-worker/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./runpod-worker
          push: true
          no-cache: true
          tags: |
            ghcr.io/feminnita/runpod-worker:latest
            ghcr.io/feminnita/runpod-worker:${{ env.SHORT_SHA }}
